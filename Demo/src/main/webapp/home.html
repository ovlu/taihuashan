<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>燕云十六声 · 宣传站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
            background: #0a0c0f;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== 顶部菜单栏 ========== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 32px;
            background: rgba(10, 12, 15, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 215, 140, 0.2);
            z-index: 100;
            flex-shrink: 0;
            position: sticky;
            top: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e6d7b8;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(200, 170, 100, 0.5);
            font-family: "Times New Roman", "宋体", serif;
            white-space: nowrap;
        }

        .logo::before {
            content: "⚔";
            font-size: 24px;
            filter: drop-shadow(0 0 6px #c9a45c);
        }

        .nav-center {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(230, 215, 184, 0.3);
            color: #e6d7b8;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(200, 170, 100, 0.15);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 15px rgba(200, 170, 100, 0.3);
        }

        .nav-right {
            display: flex;
            gap: 14px;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 视频播放器区块 */
        .video-section {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 30px auto 10px;
            padding: 0 20px;
            flex-shrink: 0;
        }

        /* ===== 太华山 Logo 区域 ===== */
        .taihua-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
            position: relative;
            padding: 10px 0;
        }

        .taihua-logo::before {
            content: '';
            flex: 1;
            max-width: 180px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 170, 100, 0.7), rgba(230, 215, 184, 0.9));
            box-shadow: 0 0 12px rgba(200, 170, 100, 0.5);
        }

        .taihua-logo::after {
            content: '';
            flex: 1;
            max-width: 180px;
            height: 1px;
            background: linear-gradient(90deg, rgba(230, 215, 184, 0.9), rgba(200, 170, 100, 0.7), transparent);
            box-shadow: 0 0 12px rgba(200, 170, 100, 0.5);
        }

        .taihua-logo-inner {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 36px;
            background: linear-gradient(145deg, rgba(22, 26, 32, 0.9), rgba(13, 16, 20, 0.95));
            border: 1px solid rgba(200, 170, 100, 0.4);
            border-radius: 60px;
            box-shadow: 
                0 0 40px rgba(200, 170, 100, 0.3),
                0 0 80px rgba(200, 170, 100, 0.12),
                inset 0 1px 0 rgba(230, 215, 184, 0.15);
            position: relative;
            overflow: hidden;
            animation: logoGlow 4s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 40px rgba(200, 170, 100, 0.3),
                    0 0 80px rgba(200, 170, 100, 0.12),
                    inset 0 1px 0 rgba(230, 215, 184, 0.15);
            }
            50% { 
                box-shadow: 
                    0 0 60px rgba(200, 170, 100, 0.5),
                    0 0 100px rgba(200, 170, 100, 0.2),
                    inset 0 1px 0 rgba(230, 215, 184, 0.25);
            }
        }

        .taihua-logo-inner::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 140, 0.15), transparent);
            animation: logoShine 3.5s ease-in-out infinite;
        }

        @keyframes logoShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .yanyun-logo-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(201, 164, 92, 0.8);
            box-shadow: 
                0 0 20px rgba(200, 170, 100, 0.8),
                0 0 40px rgba(200, 170, 100, 0.4),
                inset 0 0 10px rgba(200, 170, 100, 0.3);
            animation: logoImgFloat 3s ease-in-out infinite;
            flex-shrink: 0;
            background: #1a1e24;
            transform: rotate(-3deg);
        }

        @keyframes logoImgFloat {
            0%, 100% { 
                transform: rotate(-3deg) translateY(0);
                box-shadow: 
                    0 0 20px rgba(200, 170, 100, 0.8),
                    0 0 40px rgba(200, 170, 100, 0.4),
                    inset 0 0 10px rgba(200, 170, 100, 0.3);
            }
            50% { 
                transform: rotate(-3deg) translateY(-3px);
                box-shadow: 
                    0 0 30px rgba(200, 170, 100, 1),
                    0 0 60px rgba(200, 170, 100, 0.6),
                    inset 0 0 14px rgba(200, 170, 100, 0.4);
            }
        }

        .taihua-name {
            font-family: "STKaiti", "KaiTi", "楷体", "LiSu", "隶书", "Ma Shan Zheng", "ZCOOL XiaoWei", "Times New Roman", serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 14px;
            font-style: italic;
            background: linear-gradient(180deg, #fff8e7 0%, #f0dca8 25%, #c9a45c 60%, #a07d3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(201, 164, 92, 0.7));
            padding-left: 14px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .taihua-sub {
            font-family: "Times New Roman", serif;
            font-size: 12px;
            letter-spacing: 6px;
            color: rgba(230, 215, 184, 0.45);
            text-transform: uppercase;
            padding-left: 14px;
            margin-top: -4px;
            white-space: nowrap;
        }

        .taihua-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* ===== 视频包装（抖音iframe容器） ===== */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 
                0 0 0 1px rgba(230, 215, 184, 0.2),
                0 0 40px rgba(200, 170, 100, 0.25),
                0 20px 60px rgba(0, 0, 0, 0.8);
            background: #000;
        }

        .video-wrapper::before {
            content: '';
            display: block;
            padding-top: 56.25%;  /* 16:9 比例 */
        }

        /* 抖音 iframe 样式：绝对定位填充容器 */
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(10, 12, 15, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 170, 100, 0.4);
            border-radius: 20px;
            color: #e6d7b8;
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        .video-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #c9a45c;
            border-radius: 50%;
            box-shadow: 0 0 10px #c9a45c;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .video-title {
            text-align: center;
            padding: 18px 20px 0;
        }

        .video-title h1 {
            color: #e6d7b8;
            font-size: 26px;
            letter-spacing: 8px;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(200, 170, 100, 0.5);
            font-family: "Times New Roman", "宋体", serif;
        }

        .video-title p {
            color: rgba(230, 215, 184, 0.5);
            font-size: 13px;
            letter-spacing: 4px;
            margin-top: 8px;
        }

        /* ========== 轮播照片区块 ========== */
        .carousel-section {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #14181d 0%, #07090b 100%);
            margin-top: 20px;
            padding: 60px 0 80px;
            overflow: hidden;
            min-height: 500px;
        }

        .section-label {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(230, 215, 184, 0.6);
            font-size: 15px;
            letter-spacing: 8px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
        }

        .section-label::before,
        .section-label::after {
            content: '—';
            margin: 0 14px;
            color: rgba(200, 170, 100, 0.4);
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 80px;
            height: 380px;
        }

        .carousel-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .carousel-item {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .carousel-item-inner {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 
                0 0 0 1px rgba(230, 215, 184, 0.15),
                0 10px 40px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(200, 170, 100, 0.15);
            transition: all 0.4s ease;
            background: #1a1e24;
        }

        .carousel-item-inner:hover {
            box-shadow: 
                0 0 0 1px rgba(200, 170, 100, 0.5),
                0 15px 50px rgba(0, 0, 0, 0.8),
                0 0 50px rgba(200, 170, 100, 0.35);
            transform: translateY(-4px);
        }

        .carousel-item-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .carousel-item-inner:hover img {
            transform: scale(1.05);
        }

        .carousel-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 30px 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.85) 100%);
            color: #e6d7b8;
            pointer-events: none;
        }

        .carousel-item-overlay h3 {
            font-size: 20px;
            letter-spacing: 4px;
            font-weight: 500;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            text-shadow: 0 0 15px rgba(200, 170, 100, 0.6);
            margin-bottom: 4px;
        }

        .carousel-item-overlay p {
            font-size: 12px;
            letter-spacing: 3px;
            color: rgba(230, 215, 184, 0.6);
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(10, 12, 15, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(200, 170, 100, 0.4);
            color: #e6d7b8;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 20;
            user-select: none;
        }

        .carousel-btn:hover {
            background: rgba(200, 170, 100, 0.25);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 25px rgba(200, 170, 100, 0.5);
            transform: translateY(-50%) scale(1.08);
        }

        .carousel-btn.prev {
            left: 10px;
        }

        .carousel-btn.next {
            right: 10px;
        }

        .carousel-dots {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(230, 215, 184, 0.25);
            border: 1px solid rgba(200, 170, 100, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-dot.active {
            background: #c9a45c;
            box-shadow: 0 0 12px rgba(200, 170, 100, 0.9);
            transform: scale(1.25);
        }

        .carousel-dot:hover {
            background: rgba(200, 170, 100, 0.6);
        }

        /* ========== 放大查看遮罩层 ========== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(18px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .lightbox.show {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(200, 170, 100, 0.7), 0 0 120px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(230, 215, 184, 0.5);
            object-fit: contain;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.show img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: #e6d7b8;
            cursor: pointer;
            transition: 0.3s;
            line-height: 1;
            text-shadow: 0 0 20px rgba(200, 170, 100, 0.8);
            z-index: 1001;
            background: rgba(0, 0, 0, 0.4);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            color: #fff3d6;
            transform: rotate(90deg);
            background: rgba(200, 170, 100, 0.3);
        }

        /* ========== 加入弹窗 ========== */
        .join-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .join-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .join-modal-content {
            background: linear-gradient(145deg, #161a20, #0d1014);
            border: 1px solid rgba(200, 170, 100, 0.45);
            border-radius: 20px;
            padding: 40px 50px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 0 60px rgba(200, 170, 100, 0.25),
                0 25px 60px rgba(0, 0, 0, 0.8);
            transform: translateY(20px) scale(0.96);
            transition: transform 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .join-modal.show .join-modal-content {
            transform: translateY(0) scale(1);
        }

        .join-modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9a45c, #e6d7b8, #c9a45c, transparent);
        }

        .join-modal-content h2 {
            color: #e6d7b8;
            font-size: 24px;
            letter-spacing: 6px;
            font-weight: 500;
            margin-bottom: 8px;
            font-family: "Times New Roman", "宋体", serif;
            text-shadow: 0 0 18px rgba(200, 170, 100, 0.6);
        }

        .join-modal-content .sub {
            color: rgba(230, 215, 184, 0.4);
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        .join-divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a45c, transparent);
            margin: 0 auto 30px;
        }

        .join-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 22px;
            padding: 14px 20px;
            background: rgba(200, 170, 100, 0.06);
            border: 1px solid rgba(200, 170, 100, 0.18);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .join-item:hover {
            background: rgba(200, 170, 100, 0.12);
            border-color: rgba(200, 170, 100, 0.4);
        }

        .join-item .label {
            color: rgba(230, 215, 184, 0.6);
            font-size: 14px;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .join-item .value {
            color: #e6d7b8;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(200, 170, 100, 0.4);
            white-space: nowrap;
        }

        .join-item .value.highlight {
            color: #c9a45c;
            font-size: 18px;
        }

        .join-modal-close {
            margin-top: 12px;
            background: transparent;
            border: 1px solid rgba(200, 170, 100, 0.4);
            color: #e6d7b8;
            padding: 10px 36px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .join-modal-close:hover {
            background: rgba(200, 170, 100, 0.2);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 20px rgba(200, 170, 100, 0.35);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 14px;
            }
            .logo {
                font-size: 15px;
                letter-spacing: 2px;
            }
            .logo::before {
                font-size: 18px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 12px;
                letter-spacing: 1px;
            }
            .nav-center {
                gap: 6px;
            }
            .nav-right {
                gap: 6px;
            }
            .video-section {
                margin: 16px auto 8px;
                padding: 0 12px;
            }
            .taihua-logo {
                gap: 10px;
                margin-bottom: 16px;
            }
            .taihua-logo::before,
            .taihua-logo::after {
                max-width: 40px;
            }
            .taihua-logo-inner {
                padding: 8px 22px;
                gap: 12px;
            }
            .yanyun-logo-img {
                width: 42px;
                height: 42px;
            }
            .taihua-name {
                font-size: 28px;
                letter-spacing: 8px;
                padding-left: 8px;
            }
            .taihua-sub {
                font-size: 9px;
                letter-spacing: 4px;
                padding-left: 8px;
            }
            .video-title h1 {
                font-size: 18px;
                letter-spacing: 4px;
            }
            .video-title p {
                font-size: 11px;
                letter-spacing: 2px;
            }
            .carousel-section {
                min-height: 400px;
                padding: 50px 0 60px;
            }
            .section-label {
                font-size: 12px;
                letter-spacing: 4px;
            }
            .carousel-container {
                padding: 0 50px;
                height: 280px;
            }
            .carousel-btn {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .carousel-btn.prev {
                left: 2px;
            }
            .carousel-btn.next {
                right: 2px;
            }
            .carousel-item-overlay {
                padding: 30px 20px 14px;
            }
            .carousel-item-overlay h3 {
                font-size: 16px;
                letter-spacing: 2px;
            }
            .carousel-item-overlay p {
                font-size: 10px;
                letter-spacing: 2px;
            }
            .carousel-dots {
                bottom: 16px;
                gap: 8px;
            }
            .carousel-dot {
                width: 8px;
                height: 8px;
            }
            .lightbox-close {
                top: 16px;
                right: 16px;
                width: 44px;
                height: 44px;
                font-size: 28px;
            }
            .join-modal-content {
                padding: 30px 24px;
            }
            .join-modal-content h2 {
                font-size: 20px;
                letter-spacing: 4px;
            }
            .join-item {
                padding: 12px 14px;
                gap: 10px;
            }
            .join-item .value {
                font-size: 15px;
            }
        }

        @media (max-width: 420px) {
            .taihua-name {
                font-size: 22px;
                letter-spacing: 6px;
            }
            .yanyun-logo-img {
                width: 34px;
                height: 34px;
            }
            .taihua-logo-inner {
                padding: 6px 16px;
            }
            .taihua-logo::before,
            .taihua-logo::after {
                max-width: 20px;
            }
            .carousel-section {
                min-height: 340px;
            }
            .carousel-container {
                padding: 0 42px;
                height: 230px;
            }
            .carousel-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 顶部菜单 ========== -->
    <div class="navbar">
        <div class="logo">燕云十六声</div>
        <div class="nav-center"></div>
        <div class="nav-right">
            <button class="nav-btn" id="albumBtn">相册视频</button>
            <button class="nav-btn" id="joinBtn">加入</button>
        </div>
    </div>

    <!-- ========== 主内容区 ========== -->
    <div class="main-content">

        <!-- 视频播放器区域 -->
        <div class="video-section">

            <!-- 太华山 Logo -->
            <div class="taihua-logo">
                <div class="taihua-logo-inner">
                    <img 
                        class="yanyun-logo-img" 
                        src="https://picsum.photos/id/1015/200/200" 
                        alt="燕云十六声"
                        onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%231a1e24%22/><text x=%22100%22 y=%22115%22 font-size=%2260%22 fill=%22%23c9a45c%22 text-anchor=%22middle%22 font-family=%22serif%22>燕云</text></svg>'"
                    >
                    <div class="taihua-text-group">
                        <span class="taihua-name">太华山</span>
                        <span class="taihua-sub">TAIHUA MOUNTAIN</span>
                    </div>
                </div>
            </div>

            <!-- ===== 抖音视频 iframe 嵌入 ===== -->
            <div class="video-wrapper">
                <div class="video-badge">最新预告</div>

                <!-- 
                    ★★★ 替换下方 iframe 的 src ★★★
                    把 vid= 后面的数字换成你自己的抖音视频ID
                    例如：vid=7146408143612
                -->
                <iframe 
                    src="https://open.douyin.com/player/video?vid=7146408143612&autoplay=0"
                    frameborder="0"
                    referrerpolicy="unsafe-url"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-title">
                <h1>燕云十六声</h1>
                <p>乱世风云 · 侠客行</p>
            </div>
        </div>

        <!-- 轮播照片区域 -->
        <div class="carousel-section">
            <div class="section-label">江湖相册</div>

            <div class="carousel-container">
                <button class="carousel-btn prev" id="carouselPrev">‹</button>
                <button class="carousel-btn next" id="carouselNext">›</button>

                <div class="carousel-viewport">
                    <div class="carousel-track" id="carouselTrack"></div>
                </div>

                <div class="carousel-dots" id="carouselDots"></div>
            </div>
        </div>
    </div>

    <!-- ========== 放大查看遮罩 ========== -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" id="lightboxClose">&times;</div>
        <img id="lightboxImg" src="" alt="放大查看">
    </div>

    <!-- ========== 加入弹窗 ========== -->
    <div class="join-modal" id="joinModal">
        <div class="join-modal-content">
            <h2>加入我们</h2>
            <p class="sub">JOIN US</p>
            <div class="join-divider"></div>

            <div class="join-item">
                <span class="label">百业名称</span>
                <span class="value highlight">燕云十六声</span>
            </div>

            <div class="join-item">
                <span class="label">微信</span>
                <span class="value highlight">YanYun16</span>
            </div>

            <button class="join-modal-close" id="joinModalClose">关 闭</button>
        </div>
    </div>

    <!-- ========== 脚本 ========== -->
    <script>
        // =========================================
        // ★★★ 轮播图片配置 ★★★
        // 把下面的路径替换成你自己的本地图片
        // =========================================
        const images = [
            { url: "images/photo1.jpg",  title: "云梦泽",   subtitle: "CLOUD DREAM" },
            { url: "images/photo2.jpg",  title: "燕云关",   subtitle: "YANYUN PASS" },
            { url: "images/photo3.jpg",  title: "太华剑",   subtitle: "TAIHUA SWORD" },
            { url: "images/photo4.jpg",  title: "苍梧山",   subtitle: "CANGWU MOUNTAIN" },
            { url: "images/photo5.jpg",  title: "明月楼",   subtitle: "MOON TOWER" },
            { url: "images/photo6.jpg",  title: "落雁坡",   subtitle: "FALLING GOOSE" },
            { url: "images/photo7.jpg",  title: "破阵图",   subtitle: "BATTLE FORMATION" },
            { url: "images/photo8.jpg",  title: "寒江雪",   subtitle: "COLD RIVER SNOW" },
            { url: "images/photo9.jpg",  title: "长安道",   subtitle: "CHANGAN ROAD" },
            { url: "images/photo10.jpg", title: "烽火台",   subtitle: "BEACON TOWER" },
            { url: "images/photo11.jpg", title: "望舒阁",   subtitle: "WANGSHU PAVILION" },
            { url: "images/photo12.jpg", title: "剑门关",   subtitle: "SWORD GATE" }
        ];

        // =========================================
        // 图片压缩函数（强制压缩到指定尺寸）
        // =========================================
        function compressImage(url, maxSize = 1200, quality = 0.85) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                
                img.onload = () => {
                    let srcW = img.naturalWidth;
                    let srcH = img.naturalHeight;
                    
                    let dstW = srcW, dstH = srcH;
                    if (srcW >= srcH && srcW > maxSize) {
                        dstW = maxSize;
                        dstH = Math.round((srcH * maxSize) / srcW);
                    } else if (srcH > srcW && srcH > maxSize) {
                        dstH = maxSize;
                        dstW = Math.round((srcW * maxSize) / srcH);
                    }
                    
                    const canvas = document.createElement('canvas');
                    canvas.width = dstW;
                    canvas.height = dstH;
                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, srcW, srcH, 0, 0, dstW, dstH);
                    
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                
                img.onerror = () => {
                    // 加载失败，返回占位图
                    const canvas = document.createElement('canvas');
                    canvas.width = 800;
                    canvas.height = 500;
                    const ctx = canvas.getContext('2d');
                    const grad = ctx.createLinearGradient(0, 0, 800, 500);
                    grad.addColorStop(0, '#1a1e24');
                    grad.addColorStop(1, '#0d1014');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, 800, 500);
                    ctx.fillStyle = '#c9a45c';
                    ctx.font = 'bold 40px serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('图片加载失败', 400, 250);
                    resolve(canvas.toDataURL('image/jpeg', 0.85));
                };
                
                img.src = url;
            });
        }

        // =========================================
        // 轮播初始化
        // =========================================
        const carouselTrack = document.getElementById('carouselTrack');
        const carouselDots = document.getElementById('carouselDots');
        const prevBtn = document.getElementById('carouselPrev');
        const nextBtn = document.getElementById('carouselNext');

        let currentIndex = 0;
        let autoPlayTimer = null;
        const AUTO_PLAY_INTERVAL = 4000; // 自动播放间隔（毫秒）

        function buildCarousel() {
            carouselTrack.innerHTML = '';
            carouselDots.innerHTML = '';

            images.forEach((item, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-item';
                
                const inner = document.createElement('div');
                inner.className = 'carousel-item-inner';
                inner.dataset.index = index;
                inner.dataset.url = item.url;

                const img = document.createElement('img');
                img.alt = item.title;
                img.src = item.url;
                // 异步压缩替换
                compressImage(item.url, 1200, 0.85).then(compressedUrl => {
                    img.src = compressedUrl;
                });
                
                // 点击放大
                inner.addEventListener('click', () => {
                    const lightbox = document.getElementById('lightbox');
                    const lightboxImg = document.getElementById('lightboxImg');
                    lightboxImg.src = item.url;
                    lightbox.classList.add('show');
                    stopAutoPlay();
                });

                inner.appendChild(img);

                const overlay = document.createElement('div');
                overlay.className = 'carousel-item-overlay';
                overlay.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>${item.subtitle}</p>
                `;
                inner.appendChild(overlay);

                slide.appendChild(inner);
                carouselTrack.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
                dot.dataset.index = index;
                dot.addEventListener('click', () => {
                    goToSlide(index);
                    restartAutoPlay();
                });
                carouselDots.appendChild(dot);
            });

            updateCarousel();
        }

        function updateCarousel() {
            carouselTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            const dots = carouselDots.querySelectorAll('.carousel-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function goToSlide(index) {
            currentIndex = index;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;
            updateCarousel();
        }

        function prevSlide() {
            goToSlide(currentIndex - 1);
        }

        function nextSlide() {
            goToSlide(currentIndex + 1);
        }

        function startAutoPlay() {
            stopAutoPlay();
            autoPlayTimer = setInterval(() => {
                nextSlide();
            }, AUTO_PLAY_INTERVAL);
        }

        function stopAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
            }
        }

        function restartAutoPlay() {
            stopAutoPlay();
            startAutoPlay();
        }

        prevBtn.addEventListener('click', () => {
            prevSlide();
            restartAutoPlay();
        });

        nextBtn.addEventListener('click', () => {
            nextSlide();
            restartAutoPlay();
        });

        const carouselContainer = document.querySelector('.carousel-container');
        carouselContainer.addEventListener('mouseenter', stopAutoPlay);
        carouselContainer.addEventListener('mouseleave', startAutoPlay);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                prevSlide();
                restartAutoPlay();
            } else if (e.key === 'ArrowRight') {
                nextSlide();
                restartAutoPlay();
            }
        });

        // 触摸滑动
        let touchStartX = 0;
        let touchEndX = 0;
        const viewport = document.querySelector('.carousel-viewport');
        
        viewport.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            stopAutoPlay();
        }, { passive: true });

        viewport.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
            startAutoPlay();
        }, { passive: true });

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            }
        }

        buildCarousel();
        startAutoPlay();

        // =========================================
        // 放大查看
        // =========================================
        const lightbox = document.getElementById('lightbox');
        const lightboxClose = document.getElementById('lightboxClose');
        
        const closeLightbox = () => {
            lightbox.classList.remove('show');
            startAutoPlay();
        };

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // =========================================
        // 相册视频按钮
        // =========================================
        document.getElementById('albumBtn').addEventListener('click', () => {
            document.querySelector('.carousel-section').scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start' 
            });
        });

        // =========================================
        // 加入弹窗
        // =========================================
        const joinModal = document.getElementById('joinModal');
        const joinBtn = document.getElementById('joinBtn');
        const joinModalClose = document.getElementById('joinModalClose');

        joinBtn.addEventListener('click', () => {
            joinModal.classList.add('show');
            stopAutoPlay();
        });

        const closeJoinModal = () => {
            joinModal.classList.remove('show');
            startAutoPlay();
        };

        joinModalClose.addEventListener('click', closeJoinModal);
        joinModal.addEventListener('click', (e) => {
            if (e.target === joinModal) closeJoinModal();
        });

        // ESC 关闭所有弹窗
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (lightbox.classList.contains('show')) closeLightbox();
                if (joinModal.classList.contains('show')) closeJoinModal();
            }
        });
    </script>
</body>
</html>
