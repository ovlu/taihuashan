<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>燕云十六声 · 太华山</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
            background: #0a0806;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ============================================
           ★★★ 武侠水墨风背景 ★★★
           ============================================ */
        .bg-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(60, 40, 20, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(40, 30, 20, 0.5) 0%, transparent 50%),
                linear-gradient(180deg, #1a1410 0%, #0f0b08 50%, #0a0806 100%);
        }

        /* 1. 宣纸纹理 */
        .bg-paper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(200, 170, 120, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(180, 150, 100, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(150, 120, 80, 0.08) 0%, transparent 50%);
            mix-blend-mode: overlay;
        }

        /* 2. 远山层 - 水墨山水 */
        .bg-mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            opacity: 0.35;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 600' preserveAspectRatio='none'><path d='M0,600 L0,400 Q100,320 200,380 Q300,280 400,350 Q500,250 600,340 Q700,260 800,330 Q900,240 1000,320 Q1100,270 1200,350 Q1300,290 1400,370 Q1500,310 1600,380 L1600,600 Z' fill='%232a1f15' opacity='0.7'/><path d='M0,600 L0,480 Q150,400 300,460 Q450,380 600,450 Q750,370 900,440 Q1050,380 1200,460 Q1350,400 1500,470 Q1550,440 1600,460 L1600,600 Z' fill='%231a1208' opacity='0.8'/><path d='M0,600 L0,540 Q200,480 400,530 Q600,470 800,520 Q1000,460 1200,530 Q1400,490 1600,540 L1600,600 Z' fill='%230f0a05'/></svg>");
            background-size: cover;
            background-position: bottom center;
            animation: mountainsFade 20s ease-in-out infinite;
        }

        @keyframes mountainsFade {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.5; }
        }

        /* 3. 水墨云雾 */
        .bg-mist {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 40%, rgba(220, 200, 170, 0.06) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 60%, rgba(220, 200, 170, 0.05) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(200, 180, 150, 0.04) 0%, transparent 50%);
            animation: mistDrift 30s ease-in-out infinite;
        }

        @keyframes mistDrift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(30px); }
        }

        /* 4. 竹林剪影 - 左侧 */
        .bg-bamboo-left {
            position: absolute;
            left: 0;
            top: 0;
            width: 18%;
            height: 100%;
            opacity: 0.18;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 800' preserveAspectRatio='none'><g stroke='%232a1f15' stroke-width='8' fill='none'><path d='M30,800 L40,600 L35,400 L45,200 L40,0'/><path d='M80,800 L75,650 L85,450 L78,250 L82,0'/><path d='M120,800 L130,600 L122,400 L135,200 L125,0'/><path d='M160,800 L155,650 L165,450 L158,250 L162,0'/></g><g stroke='%233a2a1a' stroke-width='4' fill='none'><path d='M40,500 Q60,480 80,500'/><path d='M80,400 Q100,380 120,400'/><path d='M130,550 Q150,530 170,550'/><path d='M35,300 Q55,280 75,300'/></g></svg>");
            background-size: cover;
            background-position: left center;
            animation: bambooSway 8s ease-in-out infinite;
            transform-origin: bottom left;
        }

        @keyframes bambooSway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(0.8deg); }
        }

        /* 5. 竹林剪影 - 右侧 */
        .bg-bamboo-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 18%;
            height: 100%;
            opacity: 0.18;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 800' preserveAspectRatio='none'><g stroke='%232a1f15' stroke-width='8' fill='none'><path d='M30,800 L40,600 L35,400 L45,200 L40,0'/><path d='M80,800 L75,650 L85,450 L78,250 L82,0'/><path d='M120,800 L130,600 L122,400 L135,200 L125,0'/><path d='M160,800 L155,650 L165,450 L158,250 L162,0'/></g><g stroke='%233a2a1a' stroke-width='4' fill='none'><path d='M40,500 Q60,480 80,500'/><path d='M80,400 Q100,380 120,400'/><path d='M130,550 Q150,530 170,550'/><path d='M35,300 Q55,280 75,300'/></g></svg>");
            background-size: cover;
            background-position: right center;
            transform: scaleX(-1);
            animation: bambooSwayRight 9s ease-in-out infinite;
            transform-origin: bottom right;
        }

        @keyframes bambooSwayRight {
            0%, 100% { transform: scaleX(-1) rotate(0deg); }
            50% { transform: scaleX(-1) rotate(0.8deg); }
        }

        /* 6. 飘落花瓣 */
        .petals-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(220, 150, 150, 0.6) 0%, rgba(180, 90, 90, 0.4) 60%, transparent 100%);
            border-radius: 50% 0 50% 0;
            animation: petalFall linear infinite;
            opacity: 0.7;
            box-shadow: 0 0 4px rgba(200, 120, 120, 0.4);
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(110vh) translateX(100px) rotate(720deg);
                opacity: 0;
            }
        }

        /* 7. 顶部暗色渐变 */
        .bg-top-fade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, rgba(10, 8, 6, 0.9) 0%, transparent 100%);
        }

        /* 8. 底部暗色渐变 */
        .bg-bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(0deg, rgba(10, 8, 6, 0.9) 0%, transparent 100%);
        }

        .navbar, .main-content {
            position: relative;
            z-index: 1;
        }

        /* ========== 顶部菜单栏 ========== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 32px;
            background: rgba(15, 11, 8, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(200, 170, 100, 0.25);
            z-index: 100;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e6d7b8;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(200, 170, 100, 0.5);
            font-family: "Times New Roman", "宋体", serif;
            white-space: nowrap;
        }

        .logo::before {
            content: "⚔";
            font-size: 24px;
            filter: drop-shadow(0 0 6px #c9a45c);
        }

        .nav-center {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(230, 215, 184, 0.3);
            color: #e6d7b8;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .nav-btn:hover {
            background: rgba(200, 170, 100, 0.15);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 15px rgba(200, 170, 100, 0.3);
        }

        .nav-right {
            display: flex;
            gap: 14px;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 视频播放器区块 */
        .video-section {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 30px auto 10px;
            padding: 0 20px;
            flex-shrink: 0;
        }

        /* ============================================
           太华山 Logo + 左右双龙
           ============================================ */
        .taihua-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            position: relative;
            padding: 10px 0;
        }

        .dragon-left,
        .dragon-right {
            position: relative;
            height: 100px;
            flex: 1;
            max-width: 320px;
            min-width: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(200, 170, 100, 0.6));
        }

        .dragon-left svg,
        .dragon-right svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .dragon-left {
            animation: dragonLeftFloat 5s ease-in-out infinite;
        }

        @keyframes dragonLeftFloat {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(8px) translateY(-4px); }
        }

        .dragon-right {
            animation: dragonRightFloat 5s ease-in-out infinite;
        }

        @keyframes dragonRightFloat {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-8px) translateY(-4px); }
        }

        .dragon-path {
            animation: dragonGlow 3s ease-in-out infinite;
        }

        @keyframes dragonGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 4px rgba(200, 170, 100, 0.8))
                        drop-shadow(0 0 10px rgba(200, 170, 100, 0.5));
                opacity: 0.9;
            }
            50% { 
                filter: drop-shadow(0 0 8px rgba(255, 220, 150, 1))
                        drop-shadow(0 0 20px rgba(200, 170, 100, 0.8));
                opacity: 1;
            }
        }

        .dragon-right svg {
            transform: scaleX(-1);
        }

        .taihua-logo-inner {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 36px;
            background: linear-gradient(145deg, rgba(26, 20, 14, 0.9), rgba(15, 11, 8, 0.95));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(200, 170, 100, 0.4);
            border-radius: 60px;
            box-shadow: 
                0 0 40px rgba(200, 170, 100, 0.3),
                0 0 80px rgba(200, 170, 100, 0.12),
                inset 0 1px 0 rgba(230, 215, 184, 0.15);
            position: relative;
            overflow: hidden;
            animation: logoGlow 4s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes logoGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 40px rgba(200, 170, 100, 0.3),
                    0 0 80px rgba(200, 170, 100, 0.12),
                    inset 0 1px 0 rgba(230, 215, 184, 0.15);
            }
            50% { 
                box-shadow: 
                    0 0 60px rgba(200, 170, 100, 0.5),
                    0 0 100px rgba(200, 170, 100, 0.2),
                    inset 0 1px 0 rgba(230, 215, 184, 0.25);
            }
        }

        .taihua-logo-inner::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 140, 0.15), transparent);
            animation: logoShine 3.5s ease-in-out infinite;
        }

        @keyframes logoShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .yanyun-logo-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(201, 164, 92, 0.8);
            box-shadow: 
                0 0 20px rgba(200, 170, 100, 0.8),
                0 0 40px rgba(200, 170, 100, 0.4),
                inset 0 0 10px rgba(200, 170, 100, 0.3);
            animation: logoImgFloat 3s ease-in-out infinite;
            flex-shrink: 0;
            background: #1a1e24;
            transform: rotate(-3deg);
        }

        @keyframes logoImgFloat {
            0%, 100% { 
                transform: rotate(-3deg) translateY(0);
                box-shadow: 
                    0 0 20px rgba(200, 170, 100, 0.8),
                    0 0 40px rgba(200, 170, 100, 0.4),
                    inset 0 0 10px rgba(200, 170, 100, 0.3);
            }
            50% { 
                transform: rotate(-3deg) translateY(-3px);
                box-shadow: 
                    0 0 30px rgba(200, 170, 100, 1),
                    0 0 60px rgba(200, 170, 100, 0.6),
                    inset 0 0 14px rgba(200, 170, 100, 0.4);
            }
        }

        .taihua-name {
            font-family: "STKaiti", "KaiTi", "楷体", "LiSu", "隶书", "Ma Shan Zheng", "ZCOOL XiaoWei", "Times New Roman", serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 14px;
            font-style: italic;
            background: linear-gradient(180deg, #fff8e7 0%, #f0dca8 25%, #c9a45c 60%, #a07d3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(201, 164, 92, 0.7));
            padding-left: 14px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .taihua-sub {
            font-family: "Times New Roman", serif;
            font-size: 12px;
            letter-spacing: 6px;
            color: rgba(230, 215, 184, 0.45);
            text-transform: uppercase;
            padding-left: 14px;
            margin-top: -4px;
            white-space: nowrap;
        }

        .taihua-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* ===== 视频包装 ===== */
        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 
                0 0 0 1px rgba(230, 215, 184, 0.2),
                0 0 60px rgba(200, 170, 100, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.9);
            background: #000;
        }

        .video-wrapper::before {
            content: '';
            display: block;
            padding-top: 56.25%;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        .video-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(15, 11, 8, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 170, 100, 0.4);
            border-radius: 20px;
            color: #e6d7b8;
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .video-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #c9a45c;
            border-radius: 50%;
            box-shadow: 0 0 10px #c9a45c;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .video-title {
            text-align: center;
            padding: 18px 20px 0;
        }

        .video-title h1 {
            color: #e6d7b8;
            font-size: 26px;
            letter-spacing: 8px;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(200, 170, 100, 0.5);
            font-family: "Times New Roman", "宋体", serif;
        }

        .video-title p {
            color: rgba(230, 215, 184, 0.5);
            font-size: 13px;
            letter-spacing: 4px;
            margin-top: 8px;
        }

        /* ========== 轮播照片区块（背景已去除） ========== */
        .carousel-section {
            flex: 1;
            position: relative;
            background: transparent;
            margin-top: 20px;
            padding: 60px 0 80px;
            overflow: hidden;
            min-height: 560px;
        }

        .section-label {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(230, 215, 184, 0.7);
            font-size: 15px;
            letter-spacing: 8px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .section-label::before,
        .section-label::after {
            content: '—';
            margin: 0 14px;
            color: rgba(200, 170, 100, 0.5);
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 100px;
            height: 460px;
        }

        .carousel-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .carousel-item {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .carousel-item-inner {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 
                0 0 0 1px rgba(230, 215, 184, 0.15),
                0 10px 40px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(200, 170, 100, 0.15);
            transition: all 0.4s ease;
            background: #1a1e24;
        }

        .carousel-item-inner:hover {
            box-shadow: 
                0 0 0 1px rgba(200, 170, 100, 0.5),
                0 15px 50px rgba(0, 0, 0, 0.8),
                0 0 50px rgba(200, 170, 100, 0.35);
            transform: translateY(-4px);
        }

        .carousel-item-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .carousel-item-inner:hover img {
            transform: scale(1.05);
        }

        .carousel-item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 50px 40px 24px;
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.85) 100%);
            color: #e6d7b8;
            pointer-events: none;
        }

        .carousel-item-overlay h3 {
            font-size: 24px;
            letter-spacing: 4px;
            font-weight: 500;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            text-shadow: 0 0 15px rgba(200, 170, 100, 0.6);
            margin-bottom: 4px;
        }

        .carousel-item-overlay p {
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(230, 215, 184, 0.6);
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(15, 11, 8, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(200, 170, 100, 0.4);
            color: #e6d7b8;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 20;
            user-select: none;
        }

        .carousel-btn:hover {
            background: rgba(200, 170, 100, 0.25);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 25px rgba(200, 170, 100, 0.5);
            transform: translateY(-50%) scale(1.08);
        }

        .carousel-btn.prev {
            left: 14px;
        }

        .carousel-btn.next {
            right: 14px;
        }

        .carousel-dots {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(230, 215, 184, 0.25);
            border: 1px solid rgba(200, 170, 100, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-dot.active {
            background: #c9a45c;
            box-shadow: 0 0 12px rgba(200, 170, 100, 0.9);
            transform: scale(1.25);
        }

        .carousel-dot:hover {
            background: rgba(200, 170, 100, 0.6);
        }

        /* ========== 放大查看遮罩层 ========== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(18px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .lightbox.show {
            opacity: 1;

    <script>
        (function() {
            const container = document.getElementById('petalsContainer');
            if (!container) return;
            
            const PETAL_COUNT = 25;
            
            function createPetal() {
                const petal = document.createElement('div');
                petal.className = 'petal';
                
                // 随机水平位置
                petal.style.left = Math.random() * 100 + '%';
                // 随机动画时长 12~22 秒
                const duration = 12 + Math.random() * 10;
                petal.style.animationDuration = duration + 's';
                // 随机延迟 0~15 秒
                petal.style.animationDelay = Math.random() * 15 + 's';
                // 随机大小
                const size = 6 + Math.random() * 8;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                // 随机旋转方向
                petal.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                container.appendChild(petal);
            }
            
            // 初始创建
            for (let i = 0; i < PETAL_COUNT; i++) {
                createPetal();
            }
            
            // 定期补充新的花瓣，避免动画结束后消失
            setInterval(() => {
                if (container.children.length < PETAL_COUNT) {
                    createPetal();
                }
            }, 5000);
        })();
    </script>

    <script>
        const images = [

        const carouselTrack = document.getElementById('carouselTrack');
        const carouselDots = document.getElementById('carouselDots');
        const prevBtn = document.getElementById('carouselPrev');
        const nextBtn = document.getElementById('carouselNext');

        let currentIndex = 0;
        let autoPlayTimer = null;
        const AUTO_PLAY_INTERVAL = 4000;

        function buildCarousel() {
            while (carouselTrack.firstChild) {
                carouselTrack.removeChild(carouselTrack.firstChild);
            }
            while (carouselDots.firstChild) {
                carouselDots.removeChild(carouselDots.firstChild);
            }

            images.forEach((item, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-item';

                const inner = document.createElement('div');
                inner.className = 'carousel-item-inner';

                const img = document.createElement('img');
                img.alt = item.title;
                img.loading = 'lazy';
                img.decoding = 'async';

                img.addEventListener('error', function() {
                    console.warn('图片加载失败:', item.url);
                    this.style.background = 'linear-gradient(135deg, #1a1410, #0d0906)';
                    this.style.display = 'block';
                    this.removeAttribute('src');
                }, { once: true });

                img.setAttribute('src', item.url);

                inner.addEventListener('click', () => {
                    const lightbox = document.getElementById('lightbox');
                    const lightboxImg = document.getElementById('lightboxImg');
                    lightboxImg.src = item.url;
                    lightbox.classList.add('show');
                    stopAutoPlay();
                });

                inner.appendChild(img);

                const overlay = document.createElement('div');
                overlay.className = 'carousel-item-overlay';

                const h3 = document.createElement('h3');
                h3.textContent = item.title;

                const p = document.createElement('p');
                p.textContent = item.subtitle;

                overlay.appendChild(h3);
                overlay.appendChild(p);
                inner.appendChild(overlay);

                slide.appendChild(inner);
                carouselTrack.appendChild(slide);

                const dot = document.createElement('div');
                dot.className = 'carousel-dot' + (index === 0 ? ' active' : '');
                dot.addEventListener('click', () => {
                    goToSlide(index);
                    restartAutoPlay();
                });
                carouselDots.appendChild(dot);
            });

            updateCarousel();
        }

        function updateCarousel() {
            carouselTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
            const dots = carouselDots.querySelectorAll('.carousel-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function goToSlide(index) {
            currentIndex = index;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;
            updateCarousel();
        }

        function prevSlide() { goToSlide(currentIndex - 1); }
        function nextSlide() { goToSlide(currentIndex + 1); }

        function startAutoPlay() {
            stopAutoPlay();
            autoPlayTimer = setInterval(nextSlide, AUTO_PLAY_INTERVAL);
        }

        function stopAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
            }
        }

        function restartAutoPlay() {
            stopAutoPlay();
            startAutoPlay();
        }

        prevBtn.addEventListener('click', () => { prevSlide(); restartAutoPlay(); });
        nextBtn.addEventListener('click', () => { nextSlide(); restartAutoPlay(); });

        const carouselContainer = document.querySelector('.carousel-container');
        carouselContainer.addEventListener('mouseenter', stopAutoPlay);
        carouselContainer.addEventListener('mouseleave', startAutoPlay);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { prevSlide(); restartAutoPlay(); }
            else if (e.key === 'ArrowRight') { nextSlide(); restartAutoPlay(); }
        });

        let touchStartX = 0;
        const viewport = document.querySelector('.carousel-viewport');
        viewport.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            stopAutoPlay();
        }, { passive: true });
        viewport.addEventListener('touchend', (e) => {
            const diff = touchStartX - e.changedTouches[0].screenX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextSlide();
                else prevSlide();
            }
            startAutoPlay();
        }, { passive: true });

        buildCarousel();
        startAutoPlay();

        const lightbox = document.getElementById('lightbox');
        const lightboxClose = document.getElementById('lightboxClose');

        const closeLightbox = () => {
            lightbox.classList.remove('show');
            startAutoPlay();
        };

        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        document.getElementById('albumBtn').addEventListener('click', () => {
            // 方式1：当前窗口跳转
            window.location.href = 'roster.html';
            
            // 方式2：新标签页跳转（推荐，不影响当前页面）
            // window.open('album.html', '_blank');
        });

        const joinModal = document.getElementById('joinModal');
        const joinBtn = document.getElementById('joinBtn');
        const joinModalClose = document.getElementById('joinModalClose');

        joinBtn.addEventListener('click', () => {
            joinModal.classList.add('show');
            stopAutoPlay();
        });

        const closeJoinModal = () => {
            joinModal.classList.remove('show');
            startAutoPlay();
        };

        joinModalClose.addEventListener('click', closeJoinModal);
        joinModal.addEventListener('click', (e) => {
            if (e.target === joinModal) closeJoinModal();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (lightbox.classList.contains('show')) closeLightbox();
                if (joinModal.classList.contains('show')) closeJoinModal();
            }
        });
    </script>
</body>
</html>
