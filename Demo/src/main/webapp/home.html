<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>燕云十六声 · 太华山</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
            background: #0a0806;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ============================================
           ★★★ 武侠水墨风背景 ★★★
           ============================================ */
        .bg-scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(60, 40, 20, 0.6) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(40, 30, 20, 0.5) 0%, transparent 50%),
                linear-gradient(180deg, #1a1410 0%, #0f0b08 50%, #0a0806 100%);
        }

        /* 1. 宣纸纹理 */
        .bg-paper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(200, 170, 120, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(180, 150, 100, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(150, 120, 80, 0.08) 0%, transparent 50%);
            mix-blend-mode: overlay;
        }

        /* 2. 远山层 - 水墨山水 */
        .bg-mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            opacity: 0.35;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 600' preserveAspectRatio='none'><path d='M0,600 L0,400 Q100,320 200,380 Q300,280 400,350 Q500,250 600,340 Q700,260 800,330 Q900,240 1000,320 Q1100,270 1200,350 Q1300,290 1400,370 Q1500,310 1600,380 L1600,600 Z' fill='%232a1f15' opacity='0.7'/><path d='M0,600 L0,480 Q150,400 300,460 Q450,380 600,450 Q750,370 900,440 Q1050,380 1200,460 Q1350,400 1500,470 Q1550,440 1600,460 L1600,600 Z' fill='%231a1208' opacity='0.8'/><path d='M0,600 L0,540 Q200,480 400,530 Q600,470 800,520 Q1000,460 1200,530 Q1400,490 1600,540 L1600,600 Z' fill='%230f0a05'/></svg>");
            background-size: cover;
            background-position: bottom center;
            animation: mountainsFade 20s ease-in-out infinite;
        }

        @keyframes mountainsFade {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.5; }
        }

        /* 3. 水墨云雾 */
        .bg-mist {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 40%, rgba(220, 200, 170, 0.06) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 60%, rgba(220, 200, 170, 0.05) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 80%, rgba(200, 180, 150, 0.04) 0%, transparent 50%);
            animation: mistDrift 30s ease-in-out infinite;
        }

        @keyframes mistDrift {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(30px); }
        }

        /* 4. 竹林剪影 - 左侧 */
        .bg-bamboo-left {
            position: absolute;
            left: 0;
            top: 0;
            width: 18%;
            height: 100%;
            opacity: 0.18;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 800' preserveAspectRatio='none'><g stroke='%232a1f15' stroke-width='8' fill='none'><path d='M30,800 L40,600 L35,400 L45,200 L40,0'/><path d='M80,800 L75,650 L85,450 L78,250 L82,0'/><path d='M120,800 L130,600 L122,400 L135,200 L125,0'/><path d='M160,800 L155,650 L165,450 L158,250 L162,0'/></g><g stroke='%233a2a1a' stroke-width='4' fill='none'><path d='M40,500 Q60,480 80,500'/><path d='M80,400 Q100,380 120,400'/><path d='M130,550 Q150,530 170,550'/><path d='M35,300 Q55,280 75,300'/></g></svg>");
            background-size: cover;
            background-position: left center;
            animation: bambooSway 8s ease-in-out infinite;
            transform-origin: bottom left;
        }

        @keyframes bambooSway {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(0.8deg); }
        }

        /* 5. 竹林剪影 - 右侧 */
        .bg-bamboo-right {
            position: absolute;
            right: 0;
            top: 0;
            width: 18%;
            height: 100%;
            opacity: 0.18;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 800' preserveAspectRatio='none'><g stroke='%232a1f15' stroke-width='8' fill='none'><path d='M30,800 L40,600 L35,400 L45,200 L40,0'/><path d='M80,800 L75,650 L85,450 L78,250 L82,0'/><path d='M120,800 L130,600 L122,400 L135,200 L125,0'/><path d='M160,800 L155,650 L165,450 L158,250 L162,0'/></g><g stroke='%233a2a1a' stroke-width='4' fill='none'><path d='M40,500 Q60,480 80,500'/><path d='M80,400 Q100,380 120,400'/><path d='M130,550 Q150,530 170,550'/><path d='M35,300 Q55,280 75,300'/></g></svg>");
            background-size: cover;
            background-position: right center;
            transform: scaleX(-1);
            animation: bambooSwayRight 9s ease-in-out infinite;
            transform-origin: bottom right;
        }

        @keyframes bambooSwayRight {
            0%, 100% { transform: scaleX(-1) rotate(0deg); }
            50% { transform: scaleX(-1) rotate(0.8deg); }
        }

        /* 6. 飘落花瓣 */
        .petals-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(220, 150, 150, 0.6) 0%, rgba(180, 90, 90, 0.4) 60%, transparent 100%);
            border-radius: 50% 0 50% 0;
            animation: petalFall linear infinite;
            opacity: 0.7;
            box-shadow: 0 0 4px rgba(200, 120, 120, 0.4);
        }

        @keyframes petalFall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                transform: translateY(110vh) translateX(100px) rotate(720deg);
                opacity: 0;
            }
        }

        /* 7. 顶部暗色渐变 */
        .bg-top-fade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, rgba(10, 8, 6, 0.9) 0%, transparent 100%);
        }

        /* 8. 底部暗色渐变 */
        .bg-bottom-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(0deg, rgba(10, 8, 6, 0.9) 0%, transparent 100%);
        }

        .navbar, .main-content {
            position: relative;
            z-index: 1;
        }

        /* ========== 顶部菜单栏 ========== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 32px;
            background: rgba(15, 11, 8, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(200, 170, 100, 0.25);
            z-index: 100;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e6d7b8;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(200, 170, 100, 0.5);
            font-family: "Times New Roman", "宋体", serif;
            white-space: nowrap;
        }

        .logo::before {
            content: "⚔";
            font-size: 24px;
            filter: drop-shadow(0 0 6px #c9a45c);
        }

        .nav-center {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(230, 215, 184, 0.3);
            color: #e6d7b8;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .nav-btn:hover {
            background: rgba(200, 170, 100, 0.15);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 15px rgba(200, 170, 100, 0.3);
        }

        .nav-right {
            display: flex;
            gap: 14px;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 视频播放器区块（加宽以容纳右侧留言板） */
        .video-section {
            position: relative;
            width: 100%;
            max-width: 1240px;
            margin: 30px auto 10px;
            padding: 0 20px;
            flex-shrink: 0;
        }

        /* ============================================
           太华山 Logo + 左右双龙
           ============================================ */
        .taihua-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
            position: relative;
            padding: 10px 0;
        }

        .dragon-left,
        .dragon-right {
            position: relative;
            height: 100px;
            flex: 1;
            max-width: 320px;
            min-width: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(200, 170, 100, 0.6));
        }

        .dragon-left svg,
        .dragon-right svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .dragon-left {
            animation: dragonLeftFloat 5s ease-in-out infinite;
        }

        @keyframes dragonLeftFloat {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(8px) translateY(-4px); }
        }

        .dragon-right {
            animation: dragonRightFloat 5s ease-in-out infinite;
        }

        @keyframes dragonRightFloat {
            0%, 100% { transform: translateX(0) translateY(0); }
            50% { transform: translateX(-8px) translateY(-4px); }
        }

        .dragon-path {
            animation: dragonGlow 3s ease-in-out infinite;
        }

        @keyframes dragonGlow {
            0%, 100% { 
                filter: drop-shadow(0 0 4px rgba(200, 170, 100, 0.8))
                        drop-shadow(0 0 10px rgba(200, 170, 100, 0.5));
                opacity: 0.9;
            }
            50% { 
                filter: drop-shadow(0 0 8px rgba(255, 220, 150, 1))
                        drop-shadow(0 0 20px rgba(200, 170, 100, 0.8));
                opacity: 1;
            }
        }

        .dragon-right svg {
            transform: scaleX(-1);
        }

        .taihua-logo-inner {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 36px;
            background: linear-gradient(145deg, rgba(26, 20, 14, 0.9), rgba(15, 11, 8, 0.95));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(200, 170, 100, 0.4);
            border-radius: 60px;
            box-shadow: 
                0 0 40px rgba(200, 170, 100, 0.3),
                0 0 80px rgba(200, 170, 100, 0.12),
                inset 0 1px 0 rgba(230, 215, 184, 0.15);
            position: relative;
            overflow: hidden;
            animation: logoGlow 4s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes logoGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 40px rgba(200, 170, 100, 0.3),
                    0 0 80px rgba(200, 170, 100, 0.12),
                    inset 0 1px 0 rgba(230, 215, 184, 0.15);
            }
            50% { 
                box-shadow: 
                    0 0 60px rgba(200, 170, 100, 0.5),
                    0 0 100px rgba(200, 170, 100, 0.2),
                    inset 0 1px 0 rgba(230, 215, 184, 0.25);
            }
        }

        .taihua-logo-inner::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 140, 0.15), transparent);
            animation: logoShine 3.5s ease-in-out infinite;
        }

        @keyframes logoShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .yanyun-logo-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(201, 164, 92, 0.8);
            box-shadow: 
                0 0 20px rgba(200, 170, 100, 0.8),
                0 0 40px rgba(200, 170, 100, 0.4),
                inset 0 0 10px rgba(200, 170, 100, 0.3);
            animation: logoImgFloat 3s ease-in-out infinite;
            flex-shrink: 0;
            background: #1a1e24;
            transform: rotate(-3deg);
        }

        @keyframes logoImgFloat {
            0%, 100% { 
                transform: rotate(-3deg) translateY(0);
                box-shadow: 
                    0 0 20px rgba(200, 170, 100, 0.8),
                    0 0 40px rgba(200, 170, 100, 0.4),
                    inset 0 0 10px rgba(200, 170, 100, 0.3);
            }
            50% { 
                transform: rotate(-3deg) translateY(-3px);
                box-shadow: 
                    0 0 30px rgba(200, 170, 100, 1),
                    0 0 60px rgba(200, 170, 100, 0.6),
                    inset 0 0 14px rgba(200, 170, 100, 0.4);
            }
        }

        .taihua-name {
            font-family: "STKaiti", "KaiTi", "楷体", "LiSu", "隶书", "Ma Shan Zheng", "ZCOOL XiaoWei", "Times New Roman", serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 14px;
            font-style: italic;
            background: linear-gradient(180deg, #fff8e7 0%, #f0dca8 25%, #c9a45c 60%, #a07d3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(201, 164, 92, 0.7));
            padding-left: 14px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .taihua-sub {
            font-family: "Times New Roman", serif;
            font-size: 12px;
            letter-spacing: 6px;
            color: rgba(230, 215, 184, 0.45);
            text-transform: uppercase;
            padding-left: 14px;
            margin-top: -4px;
            white-space: nowrap;
        }

        .taihua-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* ===== 视频包装 ===== */
        .video-wrapper {
            /* ★ 抖音播放器底部控制栏（进度条）高度，按实际效果微调此值即可 ★ */
            --player-bar-h: 52px;

            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 
                0 0 0 1px rgba(230, 215, 184, 0.2),
                0 0 60px rgba(200, 170, 100, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.9);
            background: #000;
        }

        .video-wrapper::before {
            content: '';
            display: block;
            padding-top: 56.25%;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            /* 高度刻意多出 --player-bar-h，把底部进度条/控制栏顶到可视区下方，
               再被父级 overflow:hidden 裁掉；父级尺寸不变，视频画面不被拉伸变形 */
            height: calc(100% + var(--player-bar-h));
            border: 0;
            display: block;
        }

        /* 兜底遮挡条：若拉伸后仍有残留，取消下面 3 行注释即可再压一层 */
        /* .video-wrapper::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: var(--player-bar-h);
            background: #000;
            pointer-events: none;
        } */

        .video-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(15, 11, 8, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 170, 100, 0.4);
            border-radius: 20px;
            color: #e6d7b8;
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .video-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #c9a45c;
            border-radius: 50%;
            box-shadow: 0 0 10px #c9a45c;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .video-title {
            text-align: center;
            padding: 18px 20px 0;
        }

        .video-title h1 {
            color: #e6d7b8;
            font-size: 26px;
            letter-spacing: 8px;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(200, 170, 100, 0.5);
            font-family: "Times New Roman", "宋体", serif;
        }

        .video-title p {
            color: rgba(230, 215, 184, 0.5);
            font-size: 13px;
            letter-spacing: 4px;
            margin-top: 8px;
        }

        /* ============================================
           ★★★ 视频（左） + 山门留言板（右） ★★★
           ============================================ */
        .content-cols {
            display: flex;
            align-items: stretch;
            gap: 24px;
        }

        /* 左：视频列 */
        .video-col {
            flex: 1 1 64%;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .video-col .video-title {
            padding: 16px 0 0;
        }

        /* 右：留言板列 */
        .board-col {
            flex: 0 1 34%;
            min-width: 300px;
            max-width: 420px;
            display: flex;
        }

        .msg-board {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 340px;
            max-height: 540px;
            padding: 18px 18px 16px;
            border: 1px solid rgba(200, 170, 100, 0.35);
            border-radius: 18px;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(200, 170, 100, 0.08) 0%, transparent 60%),
                linear-gradient(160deg, rgba(26, 20, 14, 0.92) 0%, rgba(12, 8, 5, 0.95) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow:
                0 0 40px rgba(200, 170, 100, 0.15),
                0 18px 50px rgba(0, 0, 0, 0.75),
                inset 0 1px 0 rgba(230, 215, 184, 0.12);
            overflow: hidden;
            animation: boardGlow 6s ease-in-out infinite;
        }

        @keyframes boardGlow {
            0%, 100% {
                box-shadow:
                    0 0 40px rgba(200, 170, 100, 0.15),
                    0 18px 50px rgba(0, 0, 0, 0.75),
                    inset 0 1px 0 rgba(230, 215, 184, 0.12);
            }
            50% {
                box-shadow:
                    0 0 58px rgba(200, 170, 100, 0.26),
                    0 18px 50px rgba(0, 0, 0, 0.75),
                    inset 0 1px 0 rgba(230, 215, 184, 0.2);
            }
        }

        /* 顶部金色描边 */
        .msg-board::before {
            content: '';
            position: absolute;
            top: 0;
            left: 14%;
            width: 72%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a45c, #f0dcae, #c9a45c, transparent);
        }

        .msg-board-head {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .msg-seal {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(200, 170, 100, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #c9a45c;
            background: radial-gradient(circle, rgba(200, 170, 100, 0.16), transparent 70%);
            box-shadow: 0 0 16px rgba(200, 170, 100, 0.25);
        }

        .msg-head-text {
            flex: 1;
            min-width: 0;
        }

        .msg-head-text h2 {
            color: #e6d7b8;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: 4px;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            text-shadow: 0 0 16px rgba(200, 170, 100, 0.55);
            white-space: nowrap;
        }

        .msg-head-sub {
            display: block;
            color: rgba(230, 215, 184, 0.35);
            font-size: 10px;
            letter-spacing: 2px;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-count {
            flex-shrink: 0;
            min-width: 30px;
            padding: 3px 8px;
            text-align: center;
            border-radius: 20px;
            border: 1px solid rgba(200, 170, 100, 0.3);
            background: rgba(200, 170, 100, 0.08);
            color: #c9a45c;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .msg-head-badges {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        /* 同步状态：云端（绿金）/ 本地（灰） */
        .msg-state {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 20px;
            border: 1px solid rgba(200, 170, 100, 0.3);
            background: rgba(200, 170, 100, 0.08);
            color: rgba(230, 215, 184, 0.55);
            font-size: 10.5px;
            letter-spacing: 1px;
            white-space: nowrap;
            cursor: default;
        }

        .msg-state::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(230, 215, 184, 0.35);
            box-shadow: 0 0 6px rgba(230, 215, 184, 0.3);
        }

        .msg-state.cloud {
            color: #9fd6a8;
            border-color: rgba(159, 214, 168, 0.4);
            background: rgba(159, 214, 168, 0.08);
        }

        .msg-state.cloud::before {
            background: #9fd6a8;
            box-shadow: 0 0 8px rgba(159, 214, 168, 0.8);
            animation: statePulse 2.4s ease-in-out infinite;
        }

        @keyframes statePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* 提示条 */
        .msg-tip {
            display: none;
            padding: 7px 12px;
            border-radius: 10px;
            border: 1px solid rgba(200, 170, 100, 0.28);
            background: rgba(200, 170, 100, 0.08);
            color: rgba(230, 215, 184, 0.85);
            font-size: 12px;
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        .msg-tip.show { display: block; }
        .msg-tip.error {
            border-color: rgba(217, 139, 106, 0.5);
            background: rgba(217, 139, 106, 0.1);
            color: #e9b49b;
        }
        .msg-tip.ok {
            border-color: rgba(159, 214, 168, 0.45);
            background: rgba(159, 214, 168, 0.09);
            color: #a9dcb2;
        }

        .msg-divider {
            flex-shrink: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 170, 100, 0.55), transparent);
            margin: 12px 0 10px;
        }

        /* 留言列表 */
        .msg-list {
            flex: 1 1 auto;
            min-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 2px 6px 2px 2px;
            scrollbar-width: thin;
            scrollbar-color: rgba(200, 170, 100, 0.45) transparent;
        }

        .msg-list::-webkit-scrollbar { width: 4px; }
        .msg-list::-webkit-scrollbar-thumb {
            background: rgba(200, 170, 100, 0.45);
            border-radius: 4px;
        }
        .msg-list::-webkit-scrollbar-track { background: transparent; }

        .msg-item {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(200, 170, 100, 0.055);
            border: 1px solid rgba(200, 170, 100, 0.16);
            border-radius: 12px;
            transition: background 0.28s ease, border-color 0.28s ease, transform 0.28s ease;
            animation: msgIn 0.35s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg-item:hover {
            background: rgba(200, 170, 100, 0.11);
            border-color: rgba(200, 170, 100, 0.38);
            transform: translateX(3px);
        }

        .msg-avatar {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #241a0c;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            background: linear-gradient(145deg, #f7e6bd 0%, #c9a45c 60%, #a07d3a 100%);
            box-shadow: 0 0 14px rgba(200, 170, 100, 0.35);
        }

        .msg-body {
            flex: 1;
            min-width: 0;
        }

        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .msg-name {
            color: #e6d7b8;
            font-size: 13.5px;
            letter-spacing: 1px;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 45%;
        }

        .msg-time {
            margin-left: auto;
            color: rgba(230, 215, 184, 0.35);
            font-size: 11px;
            white-space: nowrap;
        }

        .msg-pending {
            flex-shrink: 0;
            padding: 1px 6px;
            border-radius: 20px;
            border: 1px solid rgba(217, 139, 106, 0.35);
            color: rgba(233, 180, 155, 0.85);
            font-size: 10px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .msg-del {
            flex-shrink: 0;
            background: none;
            border: none;
            color: rgba(230, 215, 184, 0.28);
            font-size: 12px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            transition: color 0.25s ease;
        }

        .msg-del:hover { color: #c9a45c; }

        .msg-text {
            margin-top: 4px;
            color: rgba(230, 215, 184, 0.88);
            font-size: 13px;
            line-height: 1.7;
            letter-spacing: 0.4px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* 空状态 */
        .msg-empty {
            margin: auto;
            padding: 18px 10px;
            text-align: center;
            color: rgba(230, 215, 184, 0.38);
            font-size: 12.5px;
            letter-spacing: 2px;
            line-height: 1.8;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .msg-empty-seal {
            display: block;
            font-size: 26px;
            margin-bottom: 8px;
            color: rgba(200, 170, 100, 0.35);
        }

        /* 输入区 */
        .msg-form {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(200, 170, 100, 0.16);
        }

        .msg-input-name,
        .msg-input-text {
            width: 100%;
            background: rgba(10, 7, 4, 0.6);
            border: 1px solid rgba(200, 170, 100, 0.22);
            border-radius: 10px;
            color: #e6d7b8;
            font-size: 13px;
            font-family: inherit;
            padding: 8px 10px;
            outline: none;
            transition: border-color 0.28s ease, box-shadow 0.28s ease;
        }

        .msg-input-text {
            resize: none;
            line-height: 1.6;
        }

        .msg-input-name::placeholder,
        .msg-input-text::placeholder {
            color: rgba(230, 215, 184, 0.28);
        }

        .msg-input-name:focus,
        .msg-input-text:focus {
            border-color: rgba(201, 164, 92, 0.8);
            box-shadow: 0 0 14px rgba(200, 170, 100, 0.25);
        }

        .msg-form-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .msg-counter {
            color: rgba(230, 215, 184, 0.35);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .msg-counter.over { color: #d98b6a; }

        .msg-submit {
            padding: 8px 24px;
            border-radius: 26px;
            border: 1px solid rgba(200, 170, 100, 0.5);
            background: linear-gradient(180deg, rgba(200, 170, 100, 0.22), rgba(200, 170, 100, 0.06));
            color: #fff3d6;
            font-size: 13px;
            letter-spacing: 4px;
            cursor: pointer;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            transition: all 0.3s ease;
        }

        .msg-submit:hover {
            border-color: #c9a45c;
            box-shadow: 0 0 20px rgba(200, 170, 100, 0.4);
            transform: translateY(-1px);
        }

        .msg-submit:active { transform: translateY(0); }

        /* ========== 江湖相册 · 入口卡片 ========== */
        .album-section {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 90px;
            min-height: 300px;
        }

        .section-label {
            color: rgba(230, 215, 184, 0.7);
            font-size: 15px;
            letter-spacing: 8px;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .section-label::before,
        .section-label::after {
            content: '—';
            margin: 0 14px;
            color: rgba(200, 170, 100, 0.5);
        }

        .album-entry {
            position: relative;
            display: flex;
            align-items: center;
            gap: 26px;
            width: 100%;
            max-width: 620px;
            margin-top: 30px;
            padding: 26px 34px;
            text-decoration: none;
            color: #e6d7b8;
            border: 1px solid rgba(200, 170, 100, 0.35);
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(26, 20, 14, 0.92), rgba(13, 9, 6, 0.95));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow:
                0 0 40px rgba(200, 170, 100, 0.18),
                0 18px 50px rgba(0, 0, 0, 0.75),
                inset 0 1px 0 rgba(230, 215, 184, 0.12);
            overflow: hidden;
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            animation: albumGlow 5s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes albumGlow {
            0%, 100% {
                box-shadow:
                    0 0 40px rgba(200, 170, 100, 0.18),
                    0 18px 50px rgba(0, 0, 0, 0.75),
                    inset 0 1px 0 rgba(230, 215, 184, 0.12);
            }
            50% {
                box-shadow:
                    0 0 62px rgba(200, 170, 100, 0.34),
                    0 18px 50px rgba(0, 0, 0, 0.75),
                    inset 0 1px 0 rgba(230, 215, 184, 0.2);
            }
        }

        /* 流光扫过 */
        .album-entry::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 140, 0.16), transparent);
            animation: albumShine 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes albumShine {
            0% { left: -100%; }
            55%, 100% { left: 100%; }
        }

        .album-entry:hover,
        .album-entry:focus-visible {
            animation: none;
            transform: translateY(-5px);
            border-color: #c9a45c;
            box-shadow:
                0 0 0 1px rgba(200, 170, 100, 0.45),
                0 0 70px rgba(200, 170, 100, 0.4),
                0 24px 60px rgba(0, 0, 0, 0.85),
                inset 0 1px 0 rgba(230, 215, 184, 0.25);
            outline: none;
        }

        .album-entry:active {
            transform: translateY(-2px);
        }

        .album-icon {
            flex-shrink: 0;
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            border: 1px solid rgba(200, 170, 100, 0.35);
            background: rgba(200, 170, 100, 0.08);
            color: #c9a45c;
            filter: drop-shadow(0 0 10px rgba(200, 170, 100, 0.5));
            transition: all 0.4s ease;
        }

        .album-icon svg {
            width: 34px;
            height: 34px;
            display: block;
        }

        .album-entry:hover .album-icon {
            background: rgba(200, 170, 100, 0.18);
            border-color: #c9a45c;
            color: #fff3d6;
            transform: scale(1.06);
        }

        .album-text {
            flex: 1;
            min-width: 0;
        }

        .album-text h3 {
            font-size: 21px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #e6d7b8;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            text-shadow: 0 0 15px rgba(200, 170, 100, 0.55);
            margin-bottom: 8px;
        }

        .album-text p {
            font-size: 12px;
            letter-spacing: 2px;
            color: rgba(230, 215, 184, 0.5);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .album-arrow {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(230, 215, 184, 0.6);
            transition: all 0.4s ease;
        }

        .album-arrow svg {
            width: 24px;
            height: 24px;
            display: block;
        }

        .album-entry:hover .album-arrow {
            color: #fff3d6;
            transform: translateX(6px);
            filter: drop-shadow(0 0 8px rgba(200, 170, 100, 0.8));
        }

        /* ========== 加入弹窗 ========== */
        .join-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .join-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .join-modal-content {
            background: linear-gradient(145deg, #1a1410, #0d0906);
            border: 1px solid rgba(200, 170, 100, 0.45);
            border-radius: 20px;
            padding: 40px 50px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 0 60px rgba(200, 170, 100, 0.25),
                0 25px 60px rgba(0, 0, 0, 0.8);
            transform: translateY(20px) scale(0.96);
            transition: transform 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .join-modal.show .join-modal-content {
            transform: translateY(0) scale(1);
        }

        .join-modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9a45c, #e6d7b8, #c9a45c, transparent);
        }

        .join-modal-content h2 {
            color: #e6d7b8;
            font-size: 24px;
            letter-spacing: 6px;
            font-weight: 500;
            margin-bottom: 8px;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            text-shadow: 0 0 18px rgba(200, 170, 100, 0.6);
        }

        .join-modal-content .sub {
            color: rgba(230, 215, 184, 0.4);
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        .join-divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a45c, transparent);
            margin: 0 auto 30px;
        }

        .join-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 22px;
            padding: 14px 20px;
            background: rgba(200, 170, 100, 0.06);
            border: 1px solid rgba(200, 170, 100, 0.18);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .join-item:hover {
            background: rgba(200, 170, 100, 0.12);
            border-color: rgba(200, 170, 100, 0.4);
        }

        .join-item .label {
            color: rgba(230, 215, 184, 0.6);
            font-size: 14px;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .join-item .value {
            color: #e6d7b8;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(200, 170, 100, 0.4);
            white-space: nowrap;
        }

        .join-item .value.highlight {
            color: #c9a45c;
            font-size: 18px;
        }

        .join-modal-close {
            margin-top: 12px;
            background: transparent;
            border: 1px solid rgba(200, 170, 100, 0.4);
            color: #e6d7b8;
            padding: 10px 36px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .join-modal-close:hover {
            background: rgba(200, 170, 100, 0.2);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 20px rgba(200, 170, 100, 0.35);
        }

        /* ============================================
           江湖告示 · 小弹窗
           ============================================ */
        .notice-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .notice-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .notice-card {
            width: min(88%, 380px);
            max-height: 76vh;
            overflow-y: auto;
            padding: 28px 30px 24px;
            text-align: center;
            position: relative;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(200, 170, 100, 0.10) 0%, transparent 60%),
                linear-gradient(160deg, #1c1610 0%, #100b07 100%);
            border: 1px solid rgba(200, 170, 100, 0.45);
            border-radius: 16px;
            box-shadow:
                0 0 45px rgba(200, 170, 100, 0.22),
                0 20px 50px rgba(0, 0, 0, 0.75),
                inset 0 1px 0 rgba(230, 215, 184, 0.14);
            transform: translateY(16px) scale(0.94);
            opacity: 0;
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.3s ease;
            scrollbar-width: thin;
            scrollbar-color: rgba(200, 170, 100, 0.45) transparent;
        }

        .notice-card::-webkit-scrollbar { width: 4px; }
        .notice-card::-webkit-scrollbar-thumb {
            background: rgba(200, 170, 100, 0.45);
            border-radius: 4px;
        }

        .notice-modal.show .notice-card {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* 顶部金色描边 */
        .notice-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 12%;
            width: 76%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c9a45c, #f0dcae, #c9a45c, transparent);
        }

        .notice-close-x {
            position: absolute;
            top: 10px;
            right: 12px;
            width: 26px;
            height: 26px;
            line-height: 24px;
            border: none;
            background: transparent;
            color: rgba(230, 215, 184, 0.45);
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.25s ease;
        }

        .notice-close-x:hover {
            color: #c9a45c;
            background: rgba(200, 170, 100, 0.12);
        }

        .notice-seal {
            width: 46px;
            height: 46px;
            margin: 0 auto 12px;
            border-radius: 50%;
            border: 1px solid rgba(200, 170, 100, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #c9a45c;
            background: radial-gradient(circle, rgba(200, 170, 100, 0.16), transparent 70%);
            box-shadow: 0 0 18px rgba(200, 170, 100, 0.28);
            animation: sealPulse 3.2s ease-in-out infinite;
        }

        @keyframes sealPulse {
            0%, 100% { box-shadow: 0 0 14px rgba(200, 170, 100, 0.22); }
            50% { box-shadow: 0 0 26px rgba(200, 170, 100, 0.5); }
        }

        .notice-card h3 {
            color: #e6d7b8;
            font-size: 20px;
            letter-spacing: 5px;
            font-weight: 500;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            text-shadow: 0 0 16px rgba(200, 170, 100, 0.55);
        }

        .notice-card .notice-sub {
            color: rgba(230, 215, 184, 0.38);
            font-size: 11px;
            letter-spacing: 3px;
            margin-top: 4px;
        }

        .notice-divider {
            width: 56px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a45c, transparent);
            margin: 14px auto 16px;
        }

        .notice-list {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .notice-row {
            display: flex;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(200, 170, 100, 0.055);
            border: 1px solid rgba(200, 170, 100, 0.16);
            border-radius: 10px;
            transition: all 0.28s ease;
        }

        .notice-row:hover {
            background: rgba(200, 170, 100, 0.11);
            border-color: rgba(200, 170, 100, 0.38);
            transform: translateX(3px);
        }

        .notice-row .idx {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(200, 170, 100, 0.16);
            color: #c9a45c;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
        }

        .notice-row .txt {
            color: rgba(230, 215, 184, 0.88);
            font-size: 13.5px;
            line-height: 1.7;
            letter-spacing: 0.6px;
        }

        .notice-row .txt b {
            color: #c9a45c;
            font-weight: 600;
        }

        .notice-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .notice-ok {
            width: 100%;
            padding: 10px 0;
            border-radius: 26px;
            border: 1px solid rgba(200, 170, 100, 0.5);
            background: linear-gradient(180deg, rgba(200, 170, 100, 0.22), rgba(200, 170, 100, 0.08));
            color: #fff3d6;
            font-size: 14px;
            letter-spacing: 4px;
            cursor: pointer;
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            transition: all 0.3s ease;
        }

        .notice-ok:hover {
            border-color: #c9a45c;
            box-shadow: 0 0 20px rgba(200, 170, 100, 0.4);
            transform: translateY(-1px);
        }

        .notice-nomore {
            background: none;
            border: none;
            color: rgba(230, 215, 184, 0.42);
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 2px 6px;

           ★★★ 右下角音乐播放器（武侠水墨金调）★★★
           移植自 main.html，配色改为本站金色调
           ============================================ */
        #musicPlayer {
            position: fixed;
            bottom: max(24px, env(safe-area-inset-bottom));
            right: 28px;
            z-index: 1500;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px 10px 12px;
            border-radius: 50px;
            border: 1px solid rgba(200, 170, 100, 0.35);
            background: rgba(26, 20, 14, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 0 30px rgba(200, 170, 100, 0.18), inset 0 0 30px rgba(200, 170, 100, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
            font-family: "STKaiti", "KaiTi", "楷体", "Microsoft YaHei", serif;
        }
        #musicPlayer:hover {
            border-color: rgba(201, 164, 92, 0.7);
            box-shadow: 0 0 40px rgba(200, 170, 100, 0.35), inset 0 0 30px rgba(200, 170, 100, 0.1);
            transform: translateY(-2px);
        }
        /* 外层：圆形裁切 + 边框光晕，负责切歌时的淡入淡出与缩放
           内层 img 只负责旋转，两者 transform 互不覆盖 */
        #coverWrap {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid rgba(201, 164, 92, 0.5);
            box-shadow: 0 0 15px rgba(200, 170, 100, 0.3);
            background: rgba(40, 30, 18, 0.8);
            cursor: pointer;
            transition: transform 0.3s ease, opacity 0.28s ease,
                        box-shadow 0.4s ease, border-color 0.4s ease;
        }
        #musicPlayer:hover #coverWrap {
            transform: scale(1.05);
            border-color: rgba(230, 215, 184, 0.85);
            box-shadow: 0 0 22px rgba(200, 170, 100, 0.5);
        }
        /* 切歌瞬间：缩小 + 淡出，换图后由 JS 移除。
           选择器带上 #musicPlayer 以压过上面的 :hover 规则，
           否则鼠标停在播放器上时切歌不会缩放。 */
        #musicPlayer #coverWrap.switching {
            opacity: 0;
            transform: scale(0.68) rotate(-30deg);
        }
        #musicCover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #musicInfo {
            display: flex;
            flex-direction: column;
            min-width: 0;
            max-width: 140px;
        }
        #musicTitle {
            font-size: 12px;
            color: #f0e4c8;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        #musicArtist {
            font-size: 10px;
            color: rgba(200, 180, 140, 0.55);
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        #musicToggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(201, 164, 92, 0.4);
            background: rgba(40, 30, 18, 0.6);
            color: #e6d7b8;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
            padding: 0;
            line-height: 1;
        }
        #musicToggle:hover {
            background: rgba(80, 62, 32, 0.85);
            border-color: rgba(230, 215, 184, 0.8);
            color: #fff3d6;
        }
        /* 播放键与下一首并排，主次区分：播放键略大 */
        .musicControls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        #musicNext {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid rgba(201, 164, 92, 0.3);
            background: rgba(35, 26, 16, 0.5);
            color: #cbbb95;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            padding: 0;
            line-height: 1;
            flex-shrink: 0;
        }
        #musicNext:hover {
            background: rgba(80, 62, 32, 0.85);
            border-color: rgba(230, 215, 184, 0.8);
            color: #fff3d6;
            transform: scale(1.08);
        }
        #musicNext:active {
            transform: scale(0.94);
        }
        #musicNext:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        #musicToggle.playing {
            border-color: rgba(255, 220, 150, 0.6);
            background: rgba(90, 68, 28, 0.6);
            color: #ffe9b0;
            box-shadow: 0 0 20px rgba(200, 170, 100, 0.35);
        }
        @keyframes spinCover {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #musicCover.playing {
            animation: spinCover 8s linear infinite;
        }

        /* 播放器移动端适配 */

    <script>
        (function() {
            const container = document.getElementById('petalsContainer');
            if (!container) return;
            
            const PETAL_COUNT = 25;
            
            function createPetal() {
                const petal = document.createElement('div');
                petal.className = 'petal';
                
                // 随机水平位置
                petal.style.left = Math.random() * 100 + '%';
                // 随机动画时长 12~22 秒
                const duration = 12 + Math.random() * 10;
                petal.style.animationDuration = duration + 's';
                // 随机延迟 0~15 秒
                petal.style.animationDelay = Math.random() * 15 + 's';
                // 随机大小
                const size = 6 + Math.random() * 8;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                // 随机旋转方向
                petal.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                container.appendChild(petal);
            }
            
            // 初始创建
            for (let i = 0; i < PETAL_COUNT; i++) {
                createPetal();
            }
            
            // 定期补充新的花瓣，避免动画结束后消失
            setInterval(() => {
                if (container.children.length < PETAL_COUNT) {
                    createPetal();
                }
            }, 5000);
        })();
    </script>
