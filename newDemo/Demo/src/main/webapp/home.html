<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>燕云十六声 · 宣传站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        }

        html, body {
            height: 100%;
            background: #0a0c0f;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ========== 顶部菜单栏 ========== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 32px;
            background: rgba(10, 12, 15, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 215, 140, 0.2);
            z-index: 100;
            flex-shrink: 0;
            position: sticky;
            top: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e6d7b8;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(200, 170, 100, 0.5);
            font-family: "Times New Roman", "宋体", serif;
            white-space: nowrap;
        }

        .logo::before {
            content: "⚔";
            font-size: 24px;
            filter: drop-shadow(0 0 6px #c9a45c);
        }

        .nav-center {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid rgba(230, 215, 184, 0.3);
            color: #e6d7b8;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(200, 170, 100, 0.15);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 15px rgba(200, 170, 100, 0.3);
        }

        .nav-right {
            display: flex;
            gap: 14px;
        }

        /* ========== 主内容区 ========== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* 视频播放器区块 */
        .video-section {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 30px auto 10px;
            padding: 0 20px;
            flex-shrink: 0;
        }

        /* ===== 太华山 Logo 区域 ===== */
        .taihua-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
            position: relative;
            padding: 10px 0;
        }

        .taihua-logo::before {
            content: '';
            flex: 1;
            max-width: 180px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200, 170, 100, 0.7), rgba(230, 215, 184, 0.9));
            box-shadow: 0 0 12px rgba(200, 170, 100, 0.5);
        }

        .taihua-logo::after {
            content: '';
            flex: 1;
            max-width: 180px;
            height: 1px;
            background: linear-gradient(90deg, rgba(230, 215, 184, 0.9), rgba(200, 170, 100, 0.7), transparent);
            box-shadow: 0 0 12px rgba(200, 170, 100, 0.5);
        }

        .taihua-logo-inner {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 36px;
            background: linear-gradient(145deg, rgba(22, 26, 32, 0.9), rgba(13, 16, 20, 0.95));
            border: 1px solid rgba(200, 170, 100, 0.4);
            border-radius: 60px;
            box-shadow: 
                0 0 40px rgba(200, 170, 100, 0.3),
                0 0 80px rgba(200, 170, 100, 0.12),
                inset 0 1px 0 rgba(230, 215, 184, 0.15);
            position: relative;
            overflow: hidden;
            animation: logoGlow 4s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { 
                box-shadow: 
                    0 0 40px rgba(200, 170, 100, 0.3),
                    0 0 80px rgba(200, 170, 100, 0.12),
                    inset 0 1px 0 rgba(230, 215, 184, 0.15);
            }
            50% { 
                box-shadow: 
                    0 0 60px rgba(200, 170, 100, 0.5),
                    0 0 100px rgba(200, 170, 100, 0.2),
                    inset 0 1px 0 rgba(230, 215, 184, 0.25);
            }
        }

        .taihua-logo-inner::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 140, 0.15), transparent);
            animation: logoShine 3.5s ease-in-out infinite;
        }

        @keyframes logoShine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* 燕云十六声图片 Logo */
        .yanyun-logo-img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(201, 164, 92, 0.8);
            box-shadow: 
                0 0 20px rgba(200, 170, 100, 0.8),
                0 0 40px rgba(200, 170, 100, 0.4),
                inset 0 0 10px rgba(200, 170, 100, 0.3);
            animation: logoImgFloat 3s ease-in-out infinite;
            flex-shrink: 0;
            background: #1a1e24;
            transform: rotate(-3deg);
        }

        @keyframes logoImgFloat {
            0%, 100% { 
                transform: rotate(-3deg) translateY(0);
                box-shadow: 
                    0 0 20px rgba(200, 170, 100, 0.8),
                    0 0 40px rgba(200, 170, 100, 0.4),
                    inset 0 0 10px rgba(200, 170, 100, 0.3);
            }
            50% { 
                transform: rotate(-3deg) translateY(-3px);
                box-shadow: 
                    0 0 30px rgba(200, 170, 100, 1),
                    0 0 60px rgba(200, 170, 100, 0.6),
                    inset 0 0 14px rgba(200, 170, 100, 0.4);
            }
        }

        .taihua-name {
            font-family: "STKaiti", "KaiTi", "楷体", "LiSu", "隶书", "Ma Shan Zheng", "ZCOOL XiaoWei", "Times New Roman", serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 14px;
            font-style: italic;
            background: linear-gradient(180deg, #fff8e7 0%, #f0dca8 25%, #c9a45c 60%, #a07d3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(201, 164, 92, 0.7));
            padding-left: 14px;
            line-height: 1.2;
            white-space: nowrap;
        }

        .taihua-sub {
            font-family: "Times New Roman", serif;
            font-size: 12px;
            letter-spacing: 6px;
            color: rgba(230, 215, 184, 0.45);
            text-transform: uppercase;
            padding-left: 14px;
            margin-top: -4px;
            white-space: nowrap;
        }

        .taihua-text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 
                0 0 0 1px rgba(230, 215, 184, 0.2),
                0 0 40px rgba(200, 170, 100, 0.25),
                0 20px 60px rgba(0, 0, 0, 0.8);
            background: #000;
        }

        .video-wrapper::before {
            content: '';
            display: block;
            padding-top: 56.25%;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(10, 12, 15, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(200, 170, 100, 0.4);
            border-radius: 20px;
            color: #e6d7b8;
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        .video-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #c9a45c;
            border-radius: 50%;
            box-shadow: 0 0 10px #c9a45c;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .video-title {
            text-align: center;
            padding: 18px 20px 0;
        }

        .video-title h1 {
            color: #e6d7b8;
            font-size: 26px;
            letter-spacing: 8px;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(200, 170, 100, 0.5);
            font-family: "Times New Roman", "宋体", serif;
        }

        .video-title p {
            color: rgba(230, 215, 184, 0.5);
            font-size: 13px;
            letter-spacing: 4px;
            margin-top: 8px;
        }

        /* ========== 3D 圆形相册区块（大尺寸） ========== */
        .sphere-section {
            flex: 1;
            min-height: 620px;
            position: relative;
            background: radial-gradient(circle at center, #14181d 0%, #07090b 100%);
            margin-top: 20px;
            overflow: hidden;
        }

        .section-label {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(230, 215, 184, 0.6);
            font-size: 15px;
            letter-spacing: 8px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
        }

        .section-label::before,
        .section-label::after {
            content: '—';
            margin: 0 14px;
            color: rgba(200, 170, 100, 0.4);
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* ========== 放大查看遮罩层 ========== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(18px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .lightbox.show {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(200, 170, 100, 0.7), 0 0 120px rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(230, 215, 184, 0.5);
            object-fit: contain;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .lightbox.show img {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            color: #e6d7b8;
            cursor: pointer;
            transition: 0.3s;
            line-height: 1;
            text-shadow: 0 0 20px rgba(200, 170, 100, 0.8);
            z-index: 1001;
            background: rgba(0, 0, 0, 0.4);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-close:hover {
            color: #fff3d6;
            transform: rotate(90deg);
            background: rgba(200, 170, 100, 0.3);
        }

        /* ========== 加入弹窗 ========== */
        .join-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .join-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .join-modal-content {
            background: linear-gradient(145deg, #161a20, #0d1014);
            border: 1px solid rgba(200, 170, 100, 0.45);
            border-radius: 20px;
            padding: 40px 50px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 0 60px rgba(200, 170, 100, 0.25),
                0 25px 60px rgba(0, 0, 0, 0.8);
            transform: translateY(20px) scale(0.96);
            transition: transform 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .join-modal.show .join-modal-content {
            transform: translateY(0) scale(1);
        }

        .join-modal-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #c9a45c, #e6d7b8, #c9a45c, transparent);
        }

        .join-modal-content h2 {
            color: #e6d7b8;
            font-size: 24px;
            letter-spacing: 6px;
            font-weight: 500;
            margin-bottom: 8px;
            font-family: "Times New Roman", "宋体", serif;
            text-shadow: 0 0 18px rgba(200, 170, 100, 0.6);
        }

        .join-modal-content .sub {
            color: rgba(230, 215, 184, 0.4);
            font-size: 12px;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        .join-divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a45c, transparent);
            margin: 0 auto 30px;
        }

        .join-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 22px;
            padding: 14px 20px;
            background: rgba(200, 170, 100, 0.06);
            border: 1px solid rgba(200, 170, 100, 0.18);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .join-item:hover {
            background: rgba(200, 170, 100, 0.12);
            border-color: rgba(200, 170, 100, 0.4);
        }

        .join-item .label {
            color: rgba(230, 215, 184, 0.6);
            font-size: 14px;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .join-item .value {
            color: #e6d7b8;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(200, 170, 100, 0.4);
            white-space: nowrap;
        }

        .join-item .value.highlight {
            color: #c9a45c;
            font-size: 18px;
        }

        .join-modal-close {
            margin-top: 12px;
            background: transparent;
            border: 1px solid rgba(200, 170, 100, 0.4);
            color: #e6d7b8;
            padding: 10px 36px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .join-modal-close:hover {
            background: rgba(200, 170, 100, 0.2);
            border-color: #c9a45c;
            color: #fff3d6;
            box-shadow: 0 0 20px rgba(200, 170, 100, 0.35);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            .navbar {
                padding: 10px 14px;
            }
            .logo {
                font-size: 15px;
                letter-spacing: 2px;
            }
            .logo::before {
                font-size: 18px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 12px;
                letter-spacing: 1px;
            }
            .nav-center {
                gap: 6px;
            }
            .nav-right {
                gap: 6px;
            }
            .video-section {
                margin: 16px auto 8px;
                padding: 0 12px;
            }
            .taihua-logo {
                gap: 10px;
                margin-bottom: 16px;
            }
            .taihua-logo::before,
            .taihua-logo::after {
                max-width: 40px;
            }
            .taihua-logo-inner {
                padding: 8px 22px;
                gap: 12px;
            }
            .yanyun-logo-img {
                width: 42px;
                height: 42px;
            }
            .taihua-name {
                font-size: 28px;
                letter-spacing: 8px;
                padding-left: 8px;
            }
            .taihua-sub {
                font-size: 9px;
                letter-spacing: 4px;
                padding-left: 8px;
            }
            .video-title h1 {
                font-size: 18px;
                letter-spacing: 4px;
            }
            .video-title p {
                font-size: 11px;
                letter-spacing: 2px;
            }
            .sphere-section {
                min-height: 420px;
            }
            .section-label {
                font-size: 12px;
                letter-spacing: 4px;
            }
            .lightbox-close {
                top: 16px;
                right: 16px;
                width: 44px;
                height: 44px;
                font-size: 28px;
            }
            .join-modal-content {
                padding: 30px 24px;
            }
            .join-modal-content h2 {
                font-size: 20px;
                letter-spacing: 4px;
            }
            .join-item {
                padding: 12px 14px;
                gap: 10px;
            }
            .join-item .value {
                font-size: 15px;
            }
        }

        @media (max-width: 420px) {
            .taihua-name {
                font-size: 22px;
                letter-spacing: 6px;
            }
            .yanyun-logo-img {
                width: 34px;
                height: 34px;
            }
            .taihua-logo-inner {
                padding: 6px 16px;
            }
            .taihua-logo::before,
            .taihua-logo::after {
                max-width: 20px;
            }
            .sphere-section {
                min-height: 360px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 顶部菜单 ========== -->
    <div class="navbar">
        <div class="logo">燕云十六声</div>
        <div class="nav-center"></div>
        <div class="nav-right">
            <button class="nav-btn" id="albumBtn">相册视频</button>
            <button class="nav-btn" id="joinBtn">加入</button>
        </div>
    </div>

    <!-- ========== 主内容区 ========== -->
    <div class="main-content">

        <!-- 视频播放器区域 -->
        <div class="video-section">

            <!-- 太华山 Logo -->
            <div class="taihua-logo">
                <div class="taihua-logo-inner">
                    <img 
                        class="yanyun-logo-img" 
                        src="https://picsum.photos/id/1015/200/200" 
                        alt="燕云十六声"
                        onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%231a1e24%22/><text x=%22100%22 y=%22115%22 font-size=%2260%22 fill=%22%23c9a45c%22 text-anchor=%22middle%22 font-family=%22serif%22>燕云</text></svg>'"
                    >
                    <div class="taihua-text-group">
                        <span class="taihua-name">太华山</span>
                        <span class="taihua-sub">TAIHUA MOUNTAIN</span>
                    </div>
                </div>
            </div>

            <div class="video-wrapper">
                <div class="video-badge">最新预告</div>
                <video 
                    id="promoVideo"
                    controls 
                    playsinline
                    poster="https://picsum.photos/id/1015/1280/720"
                    preload="metadata"
                >
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                    <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>
            <div class="video-title">
                <h1>燕云十六声</h1>
                <p>乱世风云 · 侠客行</p>
            </div>
        </div>

        <!-- 3D 圆形相册区域 -->
        <div class="sphere-section">
            <div class="section-label">江湖相册</div>
            <div id="canvas-container"></div>
        </div>
    </div>

    <!-- ========== 放大查看遮罩 ========== -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-close" id="lightboxClose">&times;</div>
        <img id="lightboxImg" src="" alt="放大查看">
    </div>

    <!-- ========== 加入弹窗 ========== -->
    <div class="join-modal" id="joinModal">
        <div class="join-modal-content">
            <h2>加入我们</h2>
            <p class="sub">JOIN US</p>
            <div class="join-divider"></div>

            <div class="join-item">
                <span class="label">百业名称</span>
                <span class="value highlight">燕云十六声</span>
            </div>

            <div class="join-item">
                <span class="label">微信</span>
                <span class="value highlight">YanYun16</span>
            </div>

            <button class="join-modal-close" id="joinModalClose">关 闭</button>
        </div>
    </div>

    <!-- ========== Three.js ========== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ===== 初始化场景 =====
        const container = document.getElementById('canvas-container');
        
        function init3D() {
            const width = container.clientWidth;
            const height = container.clientHeight;
            
            if (width === 0 || height === 0) {
                setTimeout(init3D, 100);
                return;
            }

            const scene = new THREE.Scene();
            
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 0, 20);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // ===== 灯光 =====
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const light1 = new THREE.PointLight(0xffffff, 0.8);
            light1.position.set(10, 10, 10);
            scene.add(light1);
            
            const light2 = new THREE.PointLight(0xccaa77, 0.6);
            light2.position.set(-10, -5, 10);
            scene.add(light2);

            // ===== 创建正圆形球体相册 =====
            const sphereRadius = 7.5;
            
            const sphereGroup = new THREE.Group();
            scene.add(sphereGroup);

            const rows = 4;
            const cols = 8;

            const imageIds = [
                1011, 1015, 1016, 1018, 1020, 1024, 1025, 1027,
                1035, 1036, 1039, 1040, 1041, 1043, 1044, 1045,
                1047, 1049, 1050, 1052, 1053, 1055, 1057, 1059
            ];

            const imageMeshes = [];

            for (let row = 0; row < rows; row++) {
                const lat = (row / (rows - 1)) * 120 - 60;
                const phiRad = THREE.MathUtils.degToRad(lat);
                
                const cosPhi = Math.cos(phiRad);
                const sinPhi = Math.sin(phiRad);
                
                const y = sphereRadius * sinPhi;
                const horizontalRadius = sphereRadius * cosPhi;

                for (let col = 0; col < cols; col++) {
                    const theta = (col / cols) * Math.PI * 2;
                    const cosTheta = Math.cos(theta);
                    const sinTheta = Math.sin(theta);
                    
                    const x = horizontalRadius * cosTheta;
                    const z = horizontalRadius * sinTheta;

                    const idx = row * cols + col;
                    if (idx >= imageIds.length) continue;

                    const imgId = imageIds[idx % imageIds.length];
                    const imgUrl = `https://picsum.photos/id/${imgId}/400/400`;

                    const textureLoader = new THREE.TextureLoader();
                    const texture = textureLoader.load(imgUrl);

                    const avgRadius = horizontalRadius;
                    let baseSize;
                    if (avgRadius > 0.1) {
                        const circumference = 2 * Math.PI * avgRadius;
                        baseSize = (circumference / cols) * 0.8;
                    } else {
                        baseSize = 1.2;
                    }
                    baseSize = Math.max(1.0, Math.min(2.8, baseSize));
                    
                    const width2 = baseSize * 1.1;
                    const height2 = baseSize * 1.1;

                    const geometry = new THREE.PlaneGeometry(width2, height2);
                    const material = new THREE.MeshStandardMaterial({
                        map: texture,
                        side: THREE.DoubleSide,
                        emissive: new THREE.Color(0x222222),
                        roughness: 0.4,
                        metalness: 0.1,
                        emissiveIntensity: 0.2
                    });

                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(x, y, z);
                    
                    const normalDir = new THREE.Vector3(x, y, z).normalize();
                    const lookTarget = new THREE.Vector3(x, y, z).add(normalDir);
                    mesh.lookAt(lookTarget);

                    mesh.userData = {
                        url: imgUrl,
                        isImageMesh: true
                    };

                    sphereGroup.add(mesh);
                    imageMeshes.push(mesh);
                }
            }

            // 线框球
            const wireframeSphere = new THREE.Mesh(
                new THREE.SphereGeometry(sphereRadius * 1.02, 32, 16),
                new THREE.MeshBasicMaterial({
                    wireframe: true,
                    color: 0xc9a45c,
                    transparent: true,
                    opacity: 0.08
                })
            );
            sphereGroup.add(wireframeSphere);

            // ===== 动画循环：自由旋转（X轴+Y轴同时转动） =====
            function animate() {
                requestAnimationFrame(animate);
                
                // 自由旋转：同时绕X轴和Y轴缓慢转动
                // 这样球体各个角度都能展示，每张图片都能被看到
                sphereGroup.rotation.y += 0.004;   // Y轴旋转
                sphereGroup.rotation.x += 0.0015;  // X轴轻微旋转
                
                renderer.render(scene, camera);
            }
            animate();

            // ===== 射线检测（点击放大） =====
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let hoveredMesh = null;

            container.addEventListener('mousemove', (event) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(imageMeshes);

                if (intersects.length > 0) {
                    if (hoveredMesh !== intersects[0].object) {
                        if (hoveredMesh) hoveredMesh.scale.set(1, 1, 1);
                        hoveredMesh = intersects[0].object;
                        hoveredMesh.scale.set(1.08, 1.08, 1.08);
                    }
                    container.style.cursor = 'pointer';
                } else {
                    if (hoveredMesh) {
                        hoveredMesh.scale.set(1, 1, 1);
                        hoveredMesh = null;
                    }
                    container.style.cursor = 'default';
                }
            });

            container.addEventListener('click', (event) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(imageMeshes);

                if (intersects.length > 0) {
                    const hit = intersects[0].object;
                    if (hit.userData.isImageMesh) {
                        const lightbox = document.getElementById('lightbox');
                        const lightboxImg = document.getElementById('lightboxImg');
                        lightboxImg.src = hit.userData.url;
                        lightbox.classList.add('show');
                    }
                }
            });

            // ===== 放大遮罩关闭 =====
            const lightbox = document.getElementById('lightbox');
            const lightboxClose = document.getElementById('lightboxClose');
            
            const closeLightbox = () => {
                lightbox.classList.remove('show');
            };

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            // ===== 窗口自适应 =====
            window.addEventListener('resize', () => {
                const w = container.clientWidth;
                const h = container.clientHeight;
                if (w === 0 || h === 0) return;
                
                renderer.setSize(w, h);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
            });
        }

        // 启动3D初始化
        init3D();

        // ===== 相册视频按钮 =====
        document.getElementById('albumBtn').addEventListener('click', () => {
            document.querySelector('.sphere-section').scrollIntoView({ 
                behavior: 'smooth', 
                block: 'start' 
            });
        });

        // ===== 加入按钮：弹出弹窗 =====
        const joinModal = document.getElementById('joinModal');
        const joinBtn = document.getElementById('joinBtn');
        const joinModalClose = document.getElementById('joinModalClose');

        joinBtn.addEventListener('click', () => {
            joinModal.classList.add('show');
        });

        const closeJoinModal = () => {
            joinModal.classList.remove('show');
        };

        joinModalClose.addEventListener('click', closeJoinModal);
        joinModal.addEventListener('click', (e) => {
            if (e.target === joinModal) closeJoinModal();
        });

        // ESC 关闭所有弹窗
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (lightbox.classList.contains('show')) closeLightbox();
                if (joinModal.classList.contains('show')) closeJoinModal();
            }
        });
    </script>
</body>
</html>
